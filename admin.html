<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fest Admin - Point Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .admin-input { background: #f3f4f6; border: 2px solid #e5e7eb; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 1.5rem; width: 100%; text-align: center; }
        .admin-input:focus { border-color: #4f46e5; outline: none; background: white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-800">POINT MANAGEMENT</h1>
                <p class="text-indigo-600 font-bold text-xs tracking-widest uppercase">Admin Control Center</p>
            </div>
            <button onclick="saveData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-2xl font-black transition-all shadow-lg shadow-indigo-200">PUSH UPDATES LIVE</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-4">
                <h2 class="font-black text-slate-500 text-sm uppercase px-2">Main Teams</h2>
                <div id="main-editor" class="space-y-4"></div>
            </div>

            <div class="lg:col-span-2 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex gap-4 mb-6 border-b pb-4 overflow-x-auto">
                    <button onclick="changeTab('subJunior')" class="font-black text-xs uppercase px-4 py-2 rounded-lg bg-slate-100 hover:bg-indigo-100 transition-colors">Sub-Junior</button>
                    <button onclick="changeTab('junior')" class="font-black text-xs uppercase px-4 py-2 rounded-lg bg-slate-100 hover:bg-indigo-100 transition-colors">Junior</button>
                    <button onclick="changeTab('senior')" class="font-black text-xs uppercase px-4 py-2 rounded-lg bg-slate-100 hover:bg-indigo-100 transition-colors">Senior</button>
                </div>
                <div id="cat-editor" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let festData = {};
        let currentTab = 'subJunior';

        socket.on('initData', (data) => { festData = data; renderAll(); });

        function renderAll() {
            // Render Main Teams
            document.getElementById('main-editor').innerHTML = festData.overall.map((t, i) => `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase">${t.name}</label>
                    <input type="number" value="${t.points}" onchange="festData.overall[${i}].points = parseInt(this.value)" class="admin-input">
                </div>
            `).join('');

            // Render Categories
            document.getElementById('cat-editor').innerHTML = festData.categories[currentTab].map((p, i) => `
                <div class="grid grid-cols-12 gap-3 items-center bg-slate-50 p-3 rounded-xl">
                    <div class="col-span-6 font-bold text-xs">
                        <input type="text" value="${p.name}" onchange="festData.categories['${currentTab}'][${i}].name=this.value" class="w-full bg-transparent border-b border-slate-300 focus:border-indigo-500 outline-none uppercase">
                    </div>
                    <div class="col-span-3">
                        <input type="text" value="${p.team}" onchange="festData.categories['${currentTab}'][${i}].team=this.value" class="w-full text-[10px] bg-white border rounded p-1 uppercase font-bold text-indigo-600">
                    </div>
                    <div class="col-span-3 text-right">
                        <input type="number" value="${p.pts}" onchange="festData.categories['${currentTab}'][${i}].pts=parseInt(this.value)" class="w-full font-black text-right bg-transparent outline-none">
                    </div>
                </div>
            `).join('');
        }

        function changeTab(tab) { currentTab = tab; renderAll(); }

        function saveData() {
            socket.emit('updateData', festData);
            alert("Broadcast Successful! All devices are now updated.");
        }
    </script>
</body>
</html>
