<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fest Admin - Management</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black">ADMIN CONTROL</h1>
            <button onclick="publish()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700">PUSH UPDATES LIVE</button>
        </div>

        <div id="main-scores" class="grid grid-cols-2 gap-4 mb-10"></div>
        
        <div class="flex gap-2 mb-4">
            <button onclick="setTab('subJunior')" class="bg-gray-200 px-4 py-2 rounded font-bold text-xs">SUB-JUNIOR</button>
            <button onclick="setTab('junior')" class="bg-gray-200 px-4 py-2 rounded font-bold text-xs">JUNIOR</button>
            <button onclick="setTab('senior')" class="bg-gray-200 px-4 py-2 rounded font-bold text-xs">SENIOR</button>
        </div>
        <div id="cat-editor" class="space-y-2"></div>
    </div>

    <script>
        const socket = io();
        let localData = null;
        let currentTab = 'subJunior';

        socket.on('initData', (data) => { localData = data; render(); });

        function render() {
            if(!localData) return;
            document.getElementById('main-scores').innerHTML = localData.overall.map((t, i) => `
                <div class="bg-slate-50 p-4 rounded-2xl border">
                    <label class="text-[10px] font-bold text-gray-400">${t.name}</label>
                    <input type="number" value="${t.points}" onchange="localData.overall[${i}].points=parseInt(this.value)" class="w-full text-3xl font-black outline-none bg-transparent">
                </div>
            `).join('');

            document.getElementById('cat-editor').innerHTML = localData.categories[currentTab].map((p, i) => `
                <div class="flex gap-2 bg-slate-50 p-2 rounded-lg items-center">
                    <input type="text" value="${p.name}" onchange="localData.categories['${currentTab}'][${i}].name=this.value" class="flex-1 p-1 text-sm">
                    <input type="text" value="${p.team}" onchange="localData.categories['${currentTab}'][${i}].team=this.value" class="w-20 p-1 text-sm uppercase">
                    <input type="number" value="${p.pts}" onchange="localData.categories['${currentTab}'][${i}].pts=parseInt(this.value)" class="w-16 p-1 text-sm font-bold">
                </div>
            `).join('');
        }

        function setTab(t) { currentTab = t; render(); }

        function publish() {
            if(prompt("Enter Admin Password") === "456456") {
                socket.emit('updateData', localData);
                alert("Updated Successfully!");
            }
        }
    </script>
</body>
</html>
