<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARQAMIYYA ART'S FEST LIVE</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { background:#ffffff; font-family: sans-serif; }
        .glass { background:rgba(0,0,0,0.05); backdrop-filter:blur(10px); border:1px solid rgba(0,0,0,0.1); }
        .live-dot { width:10px; height:10px; background:red; border-radius:50%; display:inline-block; margin-left:8px; box-shadow: 0 0 10px red; }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <header class="text-center mb-10">
        <h1 class="text-3xl font-black uppercase">ARQAMIYYA ART'S <span class="text-indigo-600">FEST</span><span class="live-dot"></span></h1>
        <p class="text-xs font-bold tracking-widest text-gray-500">LIVE LEADERBOARD 2026</p>
    </header>

    <div id="overall-display" class="max-w-4xl mx-auto space-y-4 mb-10"></div>
    <div id="category-display" class="max-w-2xl mx-auto space-y-6"></div>

    <script>
        const socket = io();
        const TARGET = 5000;

        socket.on('initData', (data) => render(data));
        socket.on('dataChanged', (data) => render(data));

        function render(data) {
            const overallHtml = data.overall.sort((a,b)=>b.points-a.points).map((t, i) => `
                <div class="glass p-6 rounded-3xl border-l-8 ${i==0?'border-yellow-500 bg-yellow-50':'border-indigo-500 bg-gray-50'}">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-4xl font-black text-gray-300">0${i+1}</span>
                            <h2 class="text-2xl font-black uppercase inline ml-4">${t.name}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-4xl font-black">${t.points}</span>
                            <p class="text-[10px] font-bold text-green-600 uppercase">Points</p>
                        </div>
                    </div>
                    <div class="w-full bg-gray-200 h-2 mt-4 rounded-full overflow-hidden">
                        <div class="bg-indigo-600 h-full" style="width:${(t.points/TARGET)*100}%"></div>
                    </div>
                </div>
            `).join('');
            document.getElementById('overall-display').innerHTML = overallHtml;

            const catHtml = Object.keys(data.categories).map(catId => `
                <div class="glass rounded-2xl overflow-hidden">
                    <div class="bg-indigo-600 text-white p-2 text-center text-xs font-bold uppercase">${catId}</div>
                    <div class="p-2">
                        ${data.categories[catId].sort((a,b)=>b.pts-a.pts).map((p,idx)=>`
                            <div class="flex justify-between p-2 border-b border-gray-100 last:border-0">
                                <span class="text-xs font-bold">${p.name} <br><small class="text-indigo-500">${p.team}</small></span>
                                <span class="font-black text-indigo-700">${p.pts}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('category-display').innerHTML = catHtml;
        }
        gsap.to(".live-dot", { opacity: 0.2, repeat: -1, yoyo: true });
    </script>
</body>
</html>
