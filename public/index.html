<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARQAMIYYA ART'S FEST LIVE</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body { background:#ffffff; color:black; font-family:'Arial',sans-serif; }
        .glass { background:rgba(0,0,0,0.05); backdrop-filter:blur(14px); border:1px solid rgba(0,0,0,0.12); }
        .live-dot { width:10px; height:10px; background:red; border-radius:50%; display:inline-block; margin-left:8px; box-shadow: 0 0 10px red; }
        .champion-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-glow { box-shadow: 0 0 15px rgba(79, 70, 229, 0.4); }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-8 px-4">

<header class="flex flex-col items-center justify-center gap-4 mb-10 text-center w-full">
    <div class="flex justify-center w-full">
        <img src="logo.png" class="w-48 transition-transform hover:scale-105">
    </div>
    
    <div class="flex flex-col items-center">
        <h1 class="text-2xl md:text-5xl font-black uppercase tracking-tight flex items-center justify-center">
            ARQAMIYYA ART'S<span class="text-indigo-500 ml-2"> FEST</span>
            <span class="live-dot ml-3"></span>
        </h1>
        <p class="text-indigo-700 font-bold uppercase text-[10px] md:text-xs tracking-[0.4em] mt-2">
            Overall Live Leaderboard 2026
        </p>
    </div>
</header>

<div class="w-full max-w-4xl space-y-6 mb-12">
    <div id="overall-body" class="space-y-4"></div>
</div>

<div class="w-full max-w-2xl space-y-6">
    <div id="cat-display-container"></div>
</div>

<script>
    const socket = io();
    const TARGET_MAX_POINTS = 5000; 
    let festData = {
        overall: [],
        categories: { subJunior: [], junior: [], senior: [] }
    };

    socket.on('initData', (data) => { festData = data; render(); });
    socket.on('dataChanged', (data) => { festData = data; render(); });

    function render() {
        if (!festData.overall) return;

        const sortedOverall = [...festData.overall].sort((a,b) => b.points - a.points);
        document.getElementById('overall-body').innerHTML = sortedOverall.map((t,i) => {
            const progress = Math.min((t.points / TARGET_MAX_POINTS) * 100, 100);
            const rankColor = i === 0 ? 'text-yellow-600' : 'text-slate-600';
            const bgColor = i === 0 ? 'bg-indigo-100' : 'bg-gray-100';
            
            return `
                <div class="champion-card glass rounded-[2rem] p-8 border-l-8 ${i === 0 ? 'border-yellow-500' : 'border-indigo-500'} ${bgColor}">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-6">
                            <span class="text-4xl md:text-6xl font-black ${rankColor}">0${i+1}</span>
                            <div>
                                <h2 class="text-xl md:text-3xl font-black tracking-widest uppercase">${t.name}</h2>
                                <p class="text-indigo-600 text-[10px] font-bold tracking-[0.3em]">CHAMPIONSHIP RACE</p>
                            </div>
                        </div>
                        <div class="text-center md:text-right">
                            <span class="text-4xl md:text-6xl font-black text-black">${t.points}</span>
                            <p class="text-green-600 font-bold text-[10px]">TOTAL POINTS</p>
                        </div>
                    </div>
                    <div class="w-full bg-black/10 h-3 mt-6 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-indigo-600 to-indigo-400 progress-glow" style="width: ${progress}%"></div>
                    </div>
                </div>
            `;
        }).join('');

        const categories = [
            { id: 'subJunior', label: 'SUB-JUNIOR', color: 'text-cyan-600', bg: 'bg-cyan-100' },
            { id: 'junior', label: 'JUNIOR', color: 'text-indigo-600', bg: 'bg-indigo-100' },
            { id: 'senior', label: 'SENIOR', color: 'text-purple-600', bg: 'bg-purple-100' }
        ];

        document.getElementById('cat-display-container').innerHTML = categories.map(cat => {
            const data = [...festData.categories[cat.id]].sort((a,b) => b.pts - a.pts);
            return `
                <div class="glass rounded-2xl overflow-hidden border border-black/10 mb-6">
                    <div class="${cat.bg} p-3 text-center text-[10px] font-black ${cat.color} border-b border-black/10 tracking-widest">${cat.label} TOP 5</div>
                    <div class="p-2">
                        ${data.map((p, i) => `
                            <div class="flex justify-between items-center p-3 border-b border-black/5 last:border-0">
                                <div class="flex items-center gap-4">
                                    <span class="text-[9px] font-bold text-gray-600">#${i+1}</span>
                                    <div>
                                        <p class="text-[11px] font-bold uppercase tracking-tight">${p.name}</p>
                                        <p class="text-[8px] text-indigo-600 font-bold uppercase">${p.team}</p>
                                    </div>
                                </div>
                                <div class="text-lg font-black text-yellow-600">${p.pts}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    gsap.to(".live-dot", { opacity: 0.3, repeat: -1, yoyo: true, duration: 0.8 });
</script>
</body>
</html>
