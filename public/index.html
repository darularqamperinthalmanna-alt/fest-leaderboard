<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE LEADERBOARD | ARQAMIYYA ART'S FEST</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #ffffff; font-family: sans-serif; overflow-x: hidden; }
        /* Professional glass effect for cards */
        .card { 
            background: rgba(0,0,0,0.03); 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 2.5rem; 
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        /* Pulsing live indicator */
        .live-dot { 
            width: 12px; 
            height: 12px; 
            background: red; 
            border-radius: 50%; 
            display: inline-block; 
            box-shadow: 0 0 10px red; 
            animation: blink 1s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <header class="flex flex-col items-center text-center mb-16 w-full">
        <div class="flex justify-center w-full mb-8">
            <img src="logo.png" class="w-48 md:w-64 drop-shadow-2xl transition-transform hover:scale-105 duration-500">
        </div>
        
        <div class="relative inline-block">
            <h1 class="text-3xl md:text-6xl font-black uppercase tracking-tighter text-slate-900">
                ARQAMIYYA ART'S <span class="text-indigo-600">FEST</span>
                <span class="live-dot ml-3 mb-1"></span>
            </h1>
            <div class="h-1.5 w-24 bg-indigo-600 mx-auto mt-2 rounded-full"></div>
            <p class="text-indigo-800 font-bold uppercase tracking-[0.4em] text-[10px] md:text-sm mt-4 opacity-80">
                Overall Live Leaderboard 2026
            </p>
        </div>
    </header>

    <div id="overall-display" class="max-w-4xl mx-auto space-y-6">
        </div>

    <script>
        const socket = io();

        // Listen for initial data and updates
        socket.on('initData', (data) => render(data));
        socket.on('dataChanged', (data) => render(data));

        function render(data) {
            if (!data || !data.overall) return;
            
            // Sort teams by points (highest first)
            const sorted = [...data.overall].sort((a,b) => b.points - a.points);
            
            const container = document.getElementById('overall-display');
            container.innerHTML = sorted.map((t, i) => `
                <div class="card p-8 md:p-10 flex flex-row justify-between items-center ${i === 0 ? 'border-yellow-400 bg-amber-50/50 shadow-lg' : 'border-indigo-100 shadow-sm'}">
                    <div class="flex items-center gap-6 md:gap-10">
                        <span class="text-5xl md:text-7xl font-black ${i === 0 ? 'text-yellow-500' : 'text-slate-200'}">0${i+1}</span>
                        
                        <div>
                            <h2 class="text-2xl md:text-4xl font-black uppercase text-slate-800 tracking-tight">${t.name}</h2>
                            <p class="text-indigo-600 font-bold text-[10px] uppercase tracking-widest mt-1">Current Ranking</p>
                        </div>
                    </div>

                    <div class="text-right bg-white/60 px-6 py-3 rounded-3xl border border-black/5">
                        <span class="text-5xl md:text-7xl font-black text-slate-900">${t.points}</span>
                        <p class="text-emerald-600 font-black text-[10px] uppercase tracking-tighter mt-1">Total Points</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
