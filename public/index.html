<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE LEADERBOARD</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #ffffff; font-family: sans-serif; }
        .live-dot { width: 12px; height: 12px; background: red; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px red; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .card { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.1); border-radius: 2.5rem; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <header class="flex flex-col items-center text-center mb-16 w-full">
        <img src="logo.png" class="w-48 md:w-64 mb-8 drop-shadow-xl">
        <h1 class="text-3xl md:text-6xl font-black uppercase tracking-tighter">
            ARQAMIYYA ART'S <span class="text-indigo-600">FEST</span>
            <span class="live-dot ml-3"></span>
        </h1>
        <p class="text-indigo-800 font-bold uppercase tracking-[0.4em] text-xs mt-4">Live Leaderboard 2026</p>
    </header>

    <div id="overall-display" class="max-w-4xl mx-auto space-y-6"></div>

    <script>
        const socket = io();
        socket.on('initData', (data) => render(data));
        socket.on('dataChanged', (data) => render(data));

        function render(data) {
            if (!data || !data.overall) return;
            const sorted = [...data.overall].sort((a,b) => b.points - a.points);
            
            document.getElementById('overall-display').innerHTML = sorted.map((t, i) => `
                <div class="card p-10 flex justify-between items-center ${i === 0 ? 'border-yellow-400 bg-amber-50/50' : 'border-indigo-500'}">
                    <div class="flex items-center gap-8">
                        <span class="text-5xl md:text-7xl font-black ${i === 0 ? 'text-yellow-500' : 'text-slate-300'}">0${i+1}</span>
                        <h2 class="text-2xl md:text-4xl font-black uppercase text-slate-800">${t.name}</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-5xl md:text-7xl font-black text-slate-900">${t.points}</span>
                        <p class="text-indigo-600 font-bold text-xs uppercase tracking-widest">Total Points</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
