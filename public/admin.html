<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fest Admin - Auto-Sync Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .admin-input { background: #f3f4f6; border: 2px solid #e5e7eb; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 1.5rem; width: 100%; text-align: center; transition: all 0.2s; }
        .admin-input:focus { border-color: #4f46e5; outline: none; background: white; box-shadow: 0 0 15px rgba(79, 70, 229, 0.1); }
        .active-tab { background-color: #4f46e5 !important; color: white !important; }
        #login-overlay { background: #0f172a; z-index: 1000; }
        .sync-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black text-slate-800 mb-6 uppercase">Admin Lock</h2>
            <input type="password" id="admin-pass" placeholder="••••••" class="w-full p-5 border-2 border-slate-100 bg-slate-50 rounded-2xl mb-4 text-center text-3xl tracking-widest outline-none focus:border-indigo-600 transition-all">
            <button onclick="checkPass()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl hover:bg-indigo-700 shadow-xl">UNLOCK</button>
        </div>
    </div>

    <div id="main-content" class="hidden p-4 md:p-10">
        <div class="max-w-5xl mx-auto">
            <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-10 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div>
                    <h1 class="text-2xl font-black text-slate-800 uppercase flex items-center">
                        <span id="status-dot" class="sync-indicator bg-green-500"></span>
                        Management
                    </h1>
                    <p id="sync-text" class="text-indigo-600 font-bold text-[10px] tracking-widest uppercase">System Ready - AutoSync Active</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="saveData()" class="bg-emerald-500 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-lg hover:bg-emerald-600 transition-all">FORCE SYNC</button>
                    <button onclick="location.reload()" class="bg-slate-100 text-slate-400 px-4 py-3 rounded-xl font-bold text-xs uppercase">Logout</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-4">
                    <h2 class="font-black text-slate-500 text-sm uppercase px-2 tracking-tighter">Overall Teams</h2>
                    <div id="main-editor" class="space-y-4"></div>
                </div>

                <div class="lg:col-span-2 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                    <div class="flex gap-2 mb-6 border-b pb-4 overflow-x-auto">
                        <button id="btn-subJunior" onclick="changeTab('subJunior')" class="tab-btn font-black text-[10px] uppercase px-4 py-2 rounded-lg bg-slate-100 transition-all">Sub-Junior</button>
                        <button id="btn-junior" onclick="changeTab('junior')" class="tab-btn font-black text-[10px] uppercase px-4 py-2 rounded-lg bg-slate-100 transition-all">Junior</button>
                        <button id="btn-senior" onclick="changeTab('senior')" class="tab-btn font-black text-[10px] uppercase px-4 py-2 rounded-lg bg-slate-100 transition-all">Senior</button>
                    </div>
                    <div id="cat-editor" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let festData = {};
        let currentTab = 'subJunior';

        function checkPass() {
            if(document.getElementById('admin-pass').value === "783asu") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                renderAll();
            }
        }

        socket.on('initData', (data) => { 
            festData = data; 
            if(!document.getElementById('main-content').classList.contains('hidden')) renderAll(); 
        });

        // AUTO-SAVE LOGIC: Triggered on every input change
        function autoSave() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('sync-text');
            
            dot.classList.replace('bg-green-500', 'bg-amber-500');
            txt.innerText = "Syncing with Server...";

            socket.emit('updateData', festData);

            setTimeout(() => {
                dot.classList.replace('bg-amber-500', 'bg-green-500');
                txt.innerText = "System Ready - AutoSync Active";
            }, 800);
        }

        function renderAll() {
            if(!festData.overall) return;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById('btn-' + currentTab).classList.add('active-tab');

            // Render Overall
            document.getElementById('main-editor').innerHTML = festData.overall.map((t, i) => `
                <div class="bg-white p-5 rounded-3xl border border-slate-200">
                    <label class="block text-[9px] font-black text-slate-400 mb-2 uppercase">${t.name}</label>
                    <input type="number" value="${t.points}" 
                           oninput="festData.overall[${i}].points = parseInt(this.value) || 0; autoSave()" 
                           class="admin-input">
                </div>
            `).join('');

            // Render Categories
            document.getElementById('cat-editor').innerHTML = festData.categories[currentTab].map((p, i) => `
                <div class="grid grid-cols-12 gap-2 items-center bg-slate-50/50 p-3 rounded-2xl border border-slate-100">
                    <div class="col-span-1 text-[9px] font-black text-slate-300">#${i+1}</div>
                    <div class="col-span-5">
                        <input type="text" value="${p.name}" 
                               oninput="festData.categories['${currentTab}'][${i}].name=this.value; autoSave()" 
                               class="w-full bg-transparent border-b border-slate-200 outline-none uppercase font-bold text-xs p-1 focus:border-indigo-400">
                    </div>
                    <div class="col-span-3">
                        <input type="text" value="${p.team}" 
                               oninput="festData.categories['${currentTab}'][${i}].team=this.value; autoSave()" 
                               class="w-full text-[9px] bg-white border rounded p-1 uppercase font-black text-indigo-500 text-center">
                    </div>
                    <div class="col-span-3 text-right">
                        <input type="number" value="${p.pts}" 
                               oninput="festData.categories['${currentTab}'][${i}].pts=parseInt(this.value) || 0; autoSave()" 
                               class="w-full font-black text-right bg-transparent outline-none text-md pr-2">
                    </div>
                </div>
            `).join('');
        }

        function changeTab(tab) { currentTab = tab; renderAll(); }
        
        function saveData() { 
            socket.emit('updateData', festData); 
            alert("Forced Cloud Sync Complete!");
        }
    </script>
</body>
</html>
