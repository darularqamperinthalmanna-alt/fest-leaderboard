<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div id="login-box" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
        <h2 class="text-2xl font-black mb-6">ADMIN KEY</h2>
        <input type="password" id="pass" placeholder="••••••" class="w-full p-4 border-2 rounded-2xl mb-4 text-center text-xl">
        <button onclick="login()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl">UNLOCK</button>
    </div>

    <div id="admin-panel" class="hidden w-full max-w-4xl bg-white rounded-[2.5rem] p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="font-black text-2xl uppercase">Edit Points</h1>
            <button onclick="save()" class="bg-emerald-500 text-white px-8 py-3 rounded-2xl font-black shadow-lg hover:bg-emerald-600">PUSH LIVE</button>
        </div>
        <div id="inputs" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <script>
        const socket = io();
        let localData = {};

        function login() {
            if(document.getElementById('pass').value === "783asu") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            }
        }

        socket.on('initData', (data) => {
            localData = data;
            const container = document.getElementById('inputs');
            container.innerHTML = localData.overall.map((t, i) => `
                <div class="bg-slate-50 p-6 rounded-2xl border-2">
                    <label class="block font-black text-slate-400 mb-2 uppercase">${t.name}</label>
                    <input type="number" value="${t.points}" 
                           onchange="localData.overall[${i}].points = parseInt(this.value) || 0"
                           class="w-full p-4 text-3xl font-black text-center rounded-xl border-2 border-indigo-100">
                </div>
            `).join('');
        });

        function save() {
            socket.emit('updateData', localData);
            alert("BROADCAST SUCCESSFUL!");
        }
    </script>
</body>
</html>
